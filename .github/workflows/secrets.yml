# Goes through every commit for what must never be in the repository: flight data and keys.
# A workflow runs after the push, and by then a public repository has shown the push to everyone,
# so this is the second check.  The first is to run the same two commands in the working copy
# before pushing; CONTRIBUTING.md has them.
name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # named, so that it runs with -e and -o pipefail

jobs:
  history:
    name: Flight data and keys in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every commit of every branch
          persist-credentials: false

      # .gitignore says which files are flight data.  It stops `git add`, but not `git add -f` and
      # not a commit made somewhere else, so the files of every commit are set against it.
      - name: No commit holds a file that .gitignore keeps out
        run: |
          git rev-list --all | xargs -n 1 git ls-tree -r --name-only | sort -u > "$RUNNER_TEMP/files"
          status=0
          git check-ignore --no-index --stdin < "$RUNNER_TEMP/files" || status=$?
          case $status in
            0)
              echo "::error::The files listed above are in the history, and .gitignore keeps them out." \
                "A commit that deletes them does not take them out of it."
              exit 1
              ;;
            1) ;;  # no file is ignored
            *) exit "$status" ;;  # the check itself failed
          esac

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          archive=gitleaks_${VERSION}_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/$archive"
          echo "$SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" gitleaks

      # The rules are in .gitleaks.toml.  --redact keeps what is found out of this log, which is public.
      - name: No commit holds a secret
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner
